name: Android APK Build

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        run: |
          sdkmanager "platform-tools" "build-tools;36.0.0" "platforms;android-36-ext1"

      - name: Ensure debug keystore exists
        run: |
          if [ ! -f debug.keystore ]; then
            keytool -genkeypair -v \
              -keystore debug.keystore \
              -storepass android \
              -alias androiddebugkey \
              -keypass android \
              -keyalg RSA -keysize 2048 -validity 10000 \
              -dname "CN=Android Debug,O=Android,C=US"
          fi

      - name: Install Gradle
        run: |
          curl --fail --location --retry 3 \
            https://services.gradle.org/distributions/gradle-9.3.1-bin.zip \
            --output /tmp/gradle.zip
          unzip -q /tmp/gradle.zip -d /tmp
          echo "/tmp/gradle-9.3.1/bin" >> "$GITHUB_PATH"

      - name: Build debug APK
        run: gradle --no-daemon --stacktrace assembleDebug

      - name: Verify APK and signature
        id: verify
        run: |
          APK="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$APK"
          APKSIGNER="$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)"
          test -n "$APKSIGNER"
          "$APKSIGNER" verify --verbose "$APK"
          "$APKSIGNER" verify --print-certs "$APK" | tee apk-certificate.txt
          sha256sum "$APK" | tee SHA256SUMS.txt

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: BootCheck-debug-apk
          path: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
            apk-certificate.txt
          if-no-files-found: error
          retention-days: 30

      - name: Publish prerelease for manual runs only
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: bootcheck-debug-${{ github.run_number }}
          name: BootCheck Debug Build #${{ github.run_number }}
          prerelease: true
          generate_release_notes: true
          files: |
            app/build/outputs/apk/debug/app-debug.apk
            SHA256SUMS.txt
            apk-certificate.txt
